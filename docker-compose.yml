version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: datapilot-backend
    ports:
      - "8000:8000"
    environment:
      - MAX_FILE_MB=250
      - CORS_ORIGINS=*
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: datapilot-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  streamlit-legacy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datapilot-streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
    profiles:
      - legacy
